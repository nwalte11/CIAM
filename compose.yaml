services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak_data:/opt/keycloak/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD}@db:5432/aegis
      OIDC_ISSUER: http://localhost:8080/realms/aegis
      OIDC_JWKS_URL: http://keycloak:8080/realms/aegis/protocol/openid-connect/certs
      AI_URL: ${AI_URL:-}
      AI_MODEL: ${AI_MODEL:-llama3.2}
      ALERT_URL: ${ALERT_URL:-}
      ALERT_BEARER_TOKEN: ${ALERT_BEARER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  keycloak_data:
